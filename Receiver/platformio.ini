; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = receiver

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct

; Ports are deliberately NOT pinned. Both boards are CH340s, so they claim
; whatever name is free — COM3/COM4 on Windows, /dev/cu.usbserial-* on macOS —
; and a pinned port is wrong on the other machine. With one board plugged in,
; PlatformIO finds it on its own. With both plugged in, name it explicitly:
;     pio run -e transmitter -t upload --upload-port <port>
; `pio device list` prints the candidates.
[env:transmitter]
lib_deps =
	sandeepmistry/LoRa @ ^0.8.0
	adafruit/Adafruit BMP280 Library @ ^2.6.8
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	jrowberg/I2Cdevlib-MPU6050 @ ^1.0.0
	mikalhart/TinyGPSPlus @ ^1.0.3
	bblanchon/ArduinoJson @ ^6.21.3
	arduino-libraries/Madgwick @ ^1.2.0
build_flags = 
	-D IS_TRANSMITTER

[env:receiver]
lib_deps =
	sandeepmistry/LoRa @ ^0.8.0
	bblanchon/ArduinoJson @ ^6.21.3
build_flags = 
	-D IS_RECEIVER

; Fault-injection build: the receiver plus the '!<text>' raw-uplink command
; that tools/fault_test.py needs in order to transmit deliberately malformed
; frames. Identical to [env:receiver] in every other respect, and the normal
; receiver build is unaffected because every addition in main.cpp sits inside
; #ifdef FAULT_TEST. Do NOT leave this flashed for a measurement run.
[env:receiver_faulttest]
extends = env:receiver
build_flags =
    ${env:receiver.build_flags}
    -D FAULT_TEST
